name: Worker

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Job ID"
        required: true

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install

      - name: Run worker
        run: node worker.js ${{ github.event.inputs.jobId }}
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
